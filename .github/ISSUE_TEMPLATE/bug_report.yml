name: Bug report
description: Report unexpected behavior, a crash, or a regression in Zoomable.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        If you have a usage question rather than a bug, please use [Discussions](https://github.com/usuiat/Zoomable/discussions/categories/q-a) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have reproduced this issue with the latest version of Zoomable.
          required: true
        - label: I have searched existing issues and did not find a duplicate.
          required: true

  - type: input
    id: version
    attributes:
      label: Zoomable version
      placeholder: e.g. 2.15.0
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Select all platforms where the issue occurs.
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Desktop (JVM)
        - Web (Wasm)
        - Web (JS)
    validations:
      required: true

  - type: dropdown
    id: api
    attributes:
      label: API
      description: Which API are you using?
      options:
        - Modifier.zoomable
        - Modifier.snapBackZoomable
        - Modifier.zoomableWithScroll
        - ZoomState only
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of related libraries. Gesture behavior often depends on the Compose version.
      placeholder: |
        - Compose Multiplatform / Jetpack Compose:
        - Kotlin:
        - Device / OS version:
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal reproducible code
      description: |
        Please include:
        - The parent layout (e.g. `LazyColumn`, `HorizontalPager`, a `clickable` parent), since many issues come from interaction with it.
        - How `ZoomState` is created and how the content size is set.
        - The image loading library (e.g. Coil), if any.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the gesture you performed (pinch, double-tap, tap-and-drag, mouse wheel, scroll, etc.).
      placeholder: |
        1. Pinch to zoom in on the image
        2. Release fingers
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: If the app crashes, paste the full stack trace.
      render: shell
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: A screen recording is very helpful for gesture-related issues.
    validations:
      required: false
